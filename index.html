    function stat(title,value,sub,link){return `<button class="card stat-card" type="button" onclick="go('${escape(link)}')" style="text-align:left;width:100%;cursor:pointer"><div class="muted" style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em">${escape(title)}</div><div class="number" style="margin-top:7px">${escape(String(value))}</div><div class="muted" style="margin-top:4px">${escape(sub)}</div></button>`}
    function progression(){
      const stage=state.memberData.stage;
      const next=stage==="Member"?"Mentee":stage==="Mentee"?"Mentor":stage==="Mentor"?"Leader":"Complete";
      const stages=["Member","Mentee","Mentor","Leader"];
      const currentIndex=Math.max(0,stages.indexOf(stage));
      const checks=thresholdChecks();
      const completed=checks.filter(x=>x.ok).length;

r Grades & Upload Proof"}</button></div></section><section class="grid2" style="margin-top:19px"><div class="card"><h2>Recent Activity</h2><div class="muted" style="line-height:2.2">• Academic record status — ${state.academicRecords.length?"Submitted":"Not yet submitted"}<br>• Community Outreach marked present — 17 Sep 2026<br>• Change Challenge completed — 29 Aug 2026</div></div><div class="card"><h2>Quick Actions</h2><div class="action-row"><button class="btn secondary" onclick="go('Chapter Calendar')">Update attendance</button><button class="btn secondary" onclick="go('Academic Hub')">Academic record</button><button class="btn secondary" onclick="go('YTR Progression')">Review requirements</button></div></div></section>`

    function calendar(){

")}</div></div><span class="badge">${escape(x.type||"Event")}</span></div>`).join("")||`<div class="notice">No events found for this chapter.</div>`}</section>`;

    function readinessPage(){const checks=thresholdChecks();return `${header("Readiness Analysis","ML decision support plus documented human-in-the-loop progression review.",`<button class="btn secondary" onclick="openReportPreview()">Open Report</button>`)}<div class="grid2"><div class="card"><span class="muted">CURRENT STAGE</span><h2 style="margin-top:8px">${state.memberData.stage}</h2><p class="sub">Next stage: <strong>${state.memberData.stage==="Member"?"Mentee":state.memberData.stage==="Mentee"?"Mentor":state.memberData.stage==="Mentor"?"Leader":"Complete"}</strong></p></div><div class="card"><span class="muted">ML READINESS SCORE</span><div class="number" style="font-size:42px;font-weight:700">${readiness()}<span class="muted">/100</span></div><p class="sub">Confidence: <strong>${confidence()}%</strong></p></div></div><div class="card" style="margin-top:19px"><div class="page-head"><div><h2>Threshold Check</h2><p class="sub">Framework requirements for ${currentTransition()}.</p></div><span class="badge ${ready()?"good":"warn"}">${ready()?"Threshold Met":"Not Yet"}</span></div>${checks.map(x=>`<div style="display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #edf2f7;padding:11px 0"><strong>${x.ok?"✓":"○"} ${x.name}</strong><span class="muted"><strong>${x.value}</strong> · ${x.need}</span></div>`).join("")}</div><div class="card" style="margin-top:19px"><div class="page-head"><div><h2>Human-in-the-Loop Mentor Intervention</h2><p class="sub">A human mentor must document the final progression action.</p></div><span class="badge ${state.hitlDecision?"good":"warn"}">${escape(hitlStatus())}</span></div><div class="action-row"><button class="btn primary" onclick="openHITL('Accept AI & Promote')">Accept AI &amp; Promote</button><button class="btn secondary" onclick="openHITL('Manual Override')">Manual Override</button><button class="btn secondary" onclick="openHITL('Defer')">Defer</button></div><p class="muted" style="margin-top:12px">All actions     function downloadReport(){let text=`YTR Leadership Development Report\nMember: Marjorie Gabatino\nReadiness: ${readiness()}/100\nConfidence: ${confidence()}%\nAttendance: ${attendanceRate()}%\nGWA: ${gwa().toFixed(2)}\nStatus: ${ready()?"READY FOR ORGANIZATIONAL REVIEW":"REQUIREMENTS INCOMPLETE"}`;let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));a.download="YTR-Marjorie-Gabatino-Report.txt";a.click();URL.revokeObjectURL(a.href);toast("Report download started.")}
    function continueToSystem(e){if(e&&typeof e.preventDefault==="function")e.preventDefault();const select=document.getElementById("chapterSelect"),msg=document.getElementById("chapterMsg"),btn=document.getElementById("continueSystemBtn");const c=select?String(select.value||"").trim():"";if(!c){if(msg)msg.innerHTML='<p class="error-text">Please select your chapter.</p>';return false}if(btn){btn.disabled=true;btn.textContent="Opening System…"}state.memberData.chapter=c;state.menteeProfile.chapter=c;if(state.currentRole==="Administrator")state.adminChapter=c;state.memberData.chapterSelected=true;state.currentPage="Dashboard";state.modal=null;try{render()}catch(err){console.error("Chapter setup render failed:",err);state.memberData.chapterSelected=false;if(msg)msg.innerHTML='<p class="error-text">The system could not open this chapter. Please try again.</p>';if(btn){btn.disabled=false;btn.textContent="Continue to System"}return false}return false}
    document.addEventListener("click",e=>{if(e.target.id==="eyeBtn"||e.target.closest("#eyeBtn")){let i=document.getElementById("loginPass");i.type=i.type==="password"?"text":"password"}})
    function handleLogin(e){e.preventDefault();const email=document.getElementById("loginEmail"),pass=document.getElementById("loginPass"),remember=document.getElementById("remember"),msg=document.getElementById("loginMsg"),btn=e&&e.submitter?e.submitter:document.querySelector("#loginForm button[type=submit]");const em=String(email?.value||"").trim().toLowerCase(),pw=String(pass?.value||"");state.loginRemember=!!remember?.checked;if(!em||!pw){if(msg)msg.innerHTML='<p class="error-text">Enter your email or username and password.</p>';return false}if(btn){btn.disabled=true;btn.textContent="Logging in…"}const role=(em==="member@ytr.test")?"Member":(em==="noren@ytr.test"||em==="mari@ytr.test")?"Mentee":(em==="mentor@ytr.test"||em==="marjorie@ytr.test")?"Mentor":(em==="admin@ytr.test"||em==="julia@ytr.test")?"Administrator":null;if(!role){if(msg)msg.innerHTML='<p class="error-text">Invalid credentials. Use one of the listed demo accounts.</p>';if(btn){btn.disabled=false;btn.textContent="LOGIN"}return false}state.currentUser={name:role==="Member"?"Julia Guiriba":role==="Mentor"?"Marjorie Gabatino":role==="Administrator"?ADMIN_DISPLAY_NAME:"Noren Allera"};state.currentRole=role;state.memberData.name=state.currentUser.name;state.memberData.stage=role==="Mentor"?"Mentor":role==="Mentee"?"Mentee":role==="Member"?"Member":"Administrator";state.memberData.chapterSelected=false;if(role==="Administrator"||role==="Member"){state.memberData.chapter="";state.menteeProfile.chapter="";}state.currentPage="Dashboard";render();return false}
    document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()})
    render();
  </script>
